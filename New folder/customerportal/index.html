<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a4e" />

    <!-- Private application — minimal, non-descriptive title -->
    <title>Customer Portal</title>

    <!-- Block ALL search engines and AI crawlers -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache"
    />
    <meta
      name="googlebot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta
      name="bingbot"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />

    <!-- Prevent referrer leakage to external sites -->
    <meta name="referrer" content="no-referrer" />

    <!-- No social-media preview cards -->
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta name="twitter:card" content="" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    <link rel="apple-touch-icon" href="/placeholder.svg" />

    <!-- PWA / Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal" />
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
